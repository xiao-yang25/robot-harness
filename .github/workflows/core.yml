name: Core on Ubuntu

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-session:
    name: Optional Python session
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Python development headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev python3-numpy python3-pip
      - name: Configure optional bridge
        run: >-
          cmake -S . -B build-python -DROBOT_HARNESS_BUILD_PYTHON=ON
          -DBUILD_TESTING=ON -DPython3_EXECUTABLE=/usr/bin/python3
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
      - name: Build bridge and run process tests
        run: |
          cmake --build build-python --target _core --parallel 2
          ctest --test-dir build-python -R '^python_session$' --output-on-failure --no-tests=error
      - name: Check optional backend payload and cleanup boundaries
        run: >-
          PYTHONPATH="$PWD/build-python/python" /usr/bin/python3 -m unittest discover
          -s integrations/mujoco/tests -v
      - name: Install optional MCP consumer dependencies
        run: /usr/bin/python3 -m pip install -r integrations/mcp/requirements.txt
      - name: Check MCP protocol, cancellation and process cleanup
        run: >-
          PYTHONPATH="$PWD/build-python/python" /usr/bin/python3 -m unittest discover
          -s integrations/mcp/tests -v
      - name: Install and consume after relocation
        run: |
          cmake --install build-python --prefix "$RUNNER_TEMP/python-install"
          mv "$RUNNER_TEMP/python-install" "$RUNNER_TEMP/python-relocated"
          cp examples/python_session.py "$RUNNER_TEMP/python-consumer.py"
          cp examples/mcp_session.py "$RUNNER_TEMP/mcp-consumer.py"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/python-relocated/lib/robot-harness/python" /usr/bin/python3 python-consumer.py
          PYTHONPATH="$RUNNER_TEMP/python-relocated/lib/robot-harness/python" /usr/bin/python3 mcp-consumer.py --output "$RUNNER_TEMP/mcp-results"
  core:
    name: Build and test Core
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitizers
          -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build ASan and UBSan
        run: cmake --build build-sanitizers --parallel 2
      - name: Test ASan and UBSan
        run: ctest --test-dir build-sanitizers --output-on-failure --no-tests=error
      - name: Install Core and run an independent consumer after relocation
        run: >-
          cmake -DSOURCE_DIR="$PWD" -DTEST_ROOT="$PWD/build-install-check"
          -DCMAKE_CXX_COMPILER=g++ -P tests/installed_core_test.cmake
