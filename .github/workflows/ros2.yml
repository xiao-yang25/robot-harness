name: Optional Nav2 example on Humble

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nav2-build:
    name: Compile Nav2 example and check observations
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install optional message dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ros-humble-nav2-msgs nlohmann-json3-dev ros-humble-std-srvs ros-humble-sensor-msgs ros-humble-rosidl-default-generators python3-dev python3-yaml ros-humble-tf2-ros
      - name: Configure and build optional example
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cmake -S integrations/ros2/fixture_interfaces -B build-nav2-interfaces -DCMAKE_INSTALL_PREFIX="$PWD/install-nav2-interfaces"
          cmake --build build-nav2-interfaces --parallel 2
          cmake --install build-nav2-interfaces
          source install-nav2-interfaces/share/m4_drive_probe/local_setup.bash
          cmake -S integrations/ros2/nav2_observation -B build-nav2 -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DROBOT_HARNESS_NAV2_SETTLEMENT=ON -DCMAKE_PREFIX_PATH="$PWD/install-nav2-interfaces"
          cmake --build build-nav2 --target robot_harness_nav2_observation robot_harness_nav2_settlement nav2_motion_permission_test nav2_motion_window_test nav2_closure_observations_test nav2_cancel_response_test nav2_runtime_observation_watch_test nav2_obstacle_watch_test --parallel 2
      - name: Check deployment guard, observations cancellation and runtime freshness
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install-nav2-interfaces/share/m4_drive_probe/local_setup.bash
          ctest --test-dir build-nav2 -R '^nav2_(requires_fresh_deployment|motion_permission|motion_window|closure_observations|cancel_response|runtime_observation_watch|obstacle_watch)$' --output-on-failure --no-tests=error
      - name: Build, relocate and check installed Nav2 owner
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install-nav2-interfaces/share/m4_drive_probe/local_setup.bash
          cmake -S . -B build-nav2-python -DROBOT_HARNESS_BUILD_PYTHON=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_LIBDIR=lib -DPython3_EXECUTABLE=/usr/bin/python3
          cmake --build build-nav2-python --target _core --parallel 2
          cmake --install build-nav2-python --prefix "$RUNNER_TEMP/nav2-python-install"
          mv "$RUNNER_TEMP/nav2-python-install" "$RUNNER_TEMP/nav2-python-relocated"
          export PYTHONPATH="$RUNNER_TEMP/nav2-python-relocated/lib/robot-harness/python${PYTHONPATH:+:$PYTHONPATH}"
          cd "$RUNNER_TEMP"
          python3 -m robot_harness_nav2 --help
          python3 "$GITHUB_WORKSPACE/integrations/ros2/nav2_session/tests/linux_driver_checks.py"
          python3 "$GITHUB_WORKSPACE/integrations/ros2/nav2_session/tests/linux_revision_checks.py"
          python3 "$GITHUB_WORKSPACE/integrations/ros2/nav2_session/tests/linux_failure_checks.py"
          python3 "$GITHUB_WORKSPACE/integrations/ros2/nav2_session/tests/linux_terminal_checks.py"
      - name: Check simulation launcher and diagnostics
        run: python3 -m unittest discover -s integrations/ros2/simulation -p 'test_*.py'
      # Gazebo movement runs use the separate manual simulation workflow.

  native-closure:
    name: Compile fixed Nav2 workers and check sealed leaf evidence
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install version-pinned native dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake 'ros-humble-nav2-controller=1.1.20-*' 'ros-humble-nav2-planner=1.1.20-*' 'ros-humble-nav2-bt-navigator=1.1.20-*'
      - name: Compile native workers and test lifecycle evidence
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          export ROS_LOCALHOST_ONLY=1 ROS_DOMAIN_ID=77
          cmake -S integrations/ros2/simulation/native_worker -B build-native -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build-native --parallel 2
          ctest --test-dir build-native --output-on-failure --no-tests=error

  drive-protocol:
    name: Compile drive and check finite/legacy wire on Humble
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install isolated Gazebo drive dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ros-humble-gazebo-ros-pkgs ros-humble-rosidl-default-generators
      - name: Build private interfaces and actual drive
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cmake -S integrations/ros2/fixture_interfaces -B build-drive-interfaces -DCMAKE_INSTALL_PREFIX="$PWD/install-drive"
          cmake --build build-drive-interfaces --parallel 2
          cmake --install build-drive-interfaces
          source install-drive/share/m4_drive_probe/local_setup.bash
          cmake -S integrations/ros2/simulation/native_drive -B build-drive -DCMAKE_PREFIX_PATH="$PWD/install-drive" -DCMAKE_INSTALL_PREFIX="$PWD/install-drive"
          cmake --build build-drive --parallel 2
          cmake --install build-drive
      - name: Check actual finite and legacy callbacks
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install-drive/share/m4_drive_probe/local_setup.bash
          export ROS_LOCALHOST_ONLY=1 ROS_DOMAIN_ID=76 M4_ISOLATED_SIMULATION=1
          export GAZEBO_MODEL_DATABASE_URI=''
          export GAZEBO_PLUGIN_PATH="$PWD/install-drive/lib:${GAZEBO_PLUGIN_PATH:-}"
          export LD_LIBRARY_PATH="$PWD/install-drive/lib:${LD_LIBRARY_PATH:-}"
          python3 integrations/ros2/simulation/native_drive/linux_protocol_checks.py
      - name: Retain native protocol diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drive-protocol-diagnostics
          path: /output
          if-no-files-found: ignore
