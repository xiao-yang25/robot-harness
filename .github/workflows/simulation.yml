name: Humble navigation simulation

on:
  workflow_dispatch:
    inputs:
      visual:
        description: Include RViz capture in the isolated run
        type: boolean
        default: false
      scenario:
        description: Isolated navigation scenario
        type: choice
        default: normal
        options:
          - normal
          - cancel-moving
          - replace-moving
          - obstacle-wait
          - obstacle-wait-frozen-scan
          - runtime-odometry-loss
          - runtime-odometry-replay
          - runtime-odometry-resume
          - runtime-clock-loss
          - runtime-stop-unreachable
          - runtime-stop-unreachable-withhold-drive-ack

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check launcher and diagnostics
        run: python3 -m unittest discover -s integrations/ros2/simulation -p 'test_*.py'
      - name: Build source and check native and Owner predicates
        env:
          VISUAL: ${{ inputs.visual }}
        shell: bash
        run: |
          set -o pipefail
          flags=()
          if [[ "$VISUAL" == true ]]; then flags+=(--visual); fi
          python3 integrations/ros2/simulation/simulate.py build "${flags[@]}" 2>&1 | tee simulation-build.log
      - name: Run isolated scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
          VISUAL: ${{ inputs.visual }}
        shell: bash
        run: |
          flags=()
          if [[ "$VISUAL" == true ]]; then flags+=(--visual); fi
          python3 integrations/ros2/simulation/simulate.py run "$SCENARIO" "${flags[@]}" --output simulation-results/run
      - name: Retain diagnostics including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-${{ inputs.scenario }}
          path: |
            simulation-build.log
            simulation-results/run
          retention-days: 14
